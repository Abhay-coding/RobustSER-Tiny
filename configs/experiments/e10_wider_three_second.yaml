experiment:
  id: E10_wider_three_second
  task: crema_d_six_emotion
  seed: 20261108
  deterministic_algorithms: true
  notes: E9 architecture with a three-second input window; compare validation against E9.
data:
  protocol: configs/data_protocol.yaml
  manifest: data/manifests/crema_d_speaker_splits.csv
  sample_rate_hz: 16000
  train_window_seconds: 3.0
  evaluation_window_policy: center_crop_or_zero_pad
  train_window_policy: seeded_random_crop_or_zero_pad
  normalization: per_utterance_mean_variance
  augmentation: none
features:
  type: mfcc
  mel_filters: 32
  mfcc_coefficients: 32
  frame_length_ms: 32
  frame_stride_ms: 32
  fft_size: 512
  log_floor: 1.0e-6
  expected_shape: [32, 93]
model:
  name: depthwise_separable_cnn_wide
  input_channels: 1
  channels: [32, 64, 96]
  dropout: 0.20
  global_average_pooling: true
training:
  optimizer: adam
  learning_rate: 0.001
  batch_size: 32
  max_epochs: 80
  selection_metric: validation_macro_f1
  early_stopping_patience: 12
  checkpoint_policy: best_validation_macro_f1
  num_data_loader_workers: 0
evaluation:
  primary_metric: macro_f1
  secondary_metrics: [balanced_accuracy, uar, accuracy, per_class_precision, per_class_recall]
  report_confusion_matrix: true
  evaluate_test_once_after_model_selection: true
replication:
  seeds: [20261108, 20261109, 20261110]
  selection_rule: Select using validation macro F1; report previously inspected test set as reused.
