experiment:
  id: E7_paper_style_cremad_random_split
  task: five_emotion_common
  seed: 20261108
  deterministic_algorithms: true
  notes: >
    Paper-style comparison only: clip-random 80/20 CREMA-D split, one-second
    32-band log-Mel features, and paper-inspired CNN. It is not an exact
    reproduction of the published modified-TESS-plus-Noise system and must not
    be compared directly with E5 speaker-independent test macro F1.
data:
  protocol: configs/data_protocol.yaml
  manifest: data/manifests/crema_d_paper_style_random_80_20.csv
  sample_rate_hz: 16000
  train_window_seconds: 1.0
  evaluation_window_policy: center_crop_or_zero_pad
  train_window_policy: seeded_random_crop_or_zero_pad
  normalization: per_utterance_mean_variance
  augmentation: none
features:
  type: log_mel_filterbank_energy
  mel_filters: 32
  frame_length_ms: 32
  frame_stride_ms: 32
  fft_size: 512
  log_floor: 1.0e-6
  expected_shape: [32, 31]
model:
  name: paper_inspired_small_cnn
  input_channels: 1
  convolution_blocks:
    - {channels: 8, kernel_size: 3, padding: 1, pool: 2}
    - {channels: 16, kernel_size: 3, padding: 1, pool: 2}
  classifier_hidden_units: 16
  dropout: 0.20
  output_classes_from_task: true
training:
  optimizer: adam
  learning_rate: 0.005
  batch_size: 32
  max_epochs: 80
  loss: cross_entropy
  class_weighting: none
  selection_metric: validation_macro_f1
  early_stopping_patience: 12
  checkpoint_policy: best_validation_macro_f1
  num_data_loader_workers: 0
evaluation:
  primary_metric: macro_f1
  secondary_metrics: [balanced_accuracy, uar, accuracy, per_class_precision, per_class_recall]
  report_confusion_matrix: true
  evaluate_test_once_after_model_selection: false
replication:
  seeds: [20261108, 20261109, 20261110]
  selection_rule: Validation-only paper-style comparison; never report as a speaker-independent test result.
